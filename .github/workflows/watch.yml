name: watch
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 watch.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - run: |
          git config user.name "flight-watch"
          git config user.email "flight-watch@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
